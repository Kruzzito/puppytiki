<!-- slider-productos.component.html -->
<div class="slider-wrapper" #sliderContainer
     (touchstart)="onTouchStart($event)"
     (touchend)="onTouchEnd($event)">
  <div class="slider-item" *ngFor="let p of productos">
    <ion-card (click)="abrirProducto(p)">
      <img [src]="p.imagenUrl" [alt]="p.producto">

      <ion-button fill="clear" color="danger"
                  class="slider-fav-btn"
                  (click)="toggleFavorito(p, $event)">
        <ion-icon [name]="esFavorito(p) ? 'heart' : 'heart-outline'"></ion-icon>
      </ion-button>

      <ion-card-header>
        <ion-card-title>{{ p.producto }}</ion-card-title>
        <ion-card-subtitle>{{ p.precio | currency:'MXN':'symbol' }}</ion-card-subtitle>
      </ion-card-header>
    </ion-card>
  </div>
</div>
